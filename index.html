<style>


@layer base {
  :root {
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-display: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font-sans);
    background-color: #090A0F;
    color: #F3F4F6;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3, .font-display {
    font-family: var(--font-display);
  }

  code, pre, .font-mono {
    font-family: var(--font-mono);
  }
}

/* Subtle custom scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #090A0F;
}
::-webkit-scrollbar-thumb {
  background: #27272A;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3F3F46;
}

/* Neo-brutalist retro card system (no blur, no transparency) */
.glass-panel {
  background: #14120F;
  border: 1.5px solid rgba(237, 140, 29, 0.22);
  box-shadow: 5px 5px 0px 0px rgba(237, 140, 29, 0.14);
}

.glass-panel-hover {
  transition: transform 0.35s var(--ease-retro), box-shadow 0.35s var(--ease-retro), border-color 0.35s var(--ease-retro), background 0.35s var(--ease-retro);
}
.glass-panel-hover:hover {
  background: #191510;
  border-color: rgba(237, 140, 29, 0.55);
  box-shadow: 7px 7px 0px 0px rgba(237, 140, 29, 0.35);
  transform: translate(-3px, -3px);
}

/* Radial Glow Gradient utility (retro amber/rust) */
.radial-glow {
  background: radial-gradient(circle at 50% 0%, rgba(237, 140, 29, 0.16) 0%, rgba(9, 10, 15, 0) 70%);
}

.radial-glow-cyan {
  background: radial-gradient(circle at 50% 0%, rgba(221, 87, 44, 0.16) 0%, rgba(9, 10, 15, 0) 70%);
}

/* Custom text clip */
.gradient-text-subtle {
  background: linear-gradient(180deg, #FFFFFF 0%, #A1A1AA 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Retro easing token, reused for buttons/links/cards */
:root {
  --ease-retro: cubic-bezier(0.16, 1, 0.3, 1);
}

/* Subtle fixed film-grain overlay, ties the whole page together */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 999;
  pointer-events: none;
  opacity: 0.05;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* Snappy default transitions for interactive elements */
a, button {
  transition: transform 0.3s var(--ease-retro), color 0.3s var(--ease-retro), background-color 0.3s var(--ease-retro), border-color 0.3s var(--ease-retro), box-shadow 0.3s var(--ease-retro);
}
button:active, a:active {
  transform: scale(0.96);
}

/* Infinite marquee ticker */
@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.marquee-track {
  display: flex;
  width: max-content;
  animation: marquee-scroll 28s linear infinite;
}
.marquee-row:hover .marquee-track {
  animation-play-state: paused;
}

/* Magnetic buttons get a smooth spring-like pull via inline transform (see bootstrap script) */
[data-magnetic] {
  transition: transform 0.25s var(--ease-retro);
  will-change: transform;
}

</style>

 Project","Java","Linux / Ubuntu","CLI / TUI","Shell Scripting","IntelliJ IDEA"],techStack:["Java","Linux / Bash","ANSI Escape Codes","IntelliJ IDEA","Git"],metrics:[{label:"Execution Speed",value:"< 5ms",detail:"Instantaneous terminal response"},{label:"Interface",value:"Keyboard TUI",detail:"Distraction-free workflow"},{label:"Development Status",value:"Active",detail:"Adding streak analytics & export features"}],caseStudy:{overview:"Currently in active development, the Terminal UI Habit Tracker is designed to bridge console-based developer workflows with personal productivity and accountability.",challenge:"Handling interactive keyboard navigation, dynamic terminal window resizing, and ANSI color escape sequences cleanly across different terminal emulators (Ubuntu Bash, zsh, xterm).",architecture:["Implemented an object-oriented habit model in Java with streak calculation and frequency management.","Created custom ASCII progress bars and weekly commitment heatmaps rendered directly in the terminal output.","Designed lightweight JSON/CSV file persistence to keep data completely local, private, and portable."],outcomes:["Functional interactive menu system with quick-log hotkeys.","Active development repository on GitHub with ongoing modular feature additions."],quote:{text:"Building terminal applications teaches deep fundamentals about operating system I/O, user interaction loops, and computational efficiency.",author:"Kshitij Varshney",title:"Project Creator"}}},{id:"tbc-restaurant",title:"TBC Restaurant Website",subtitle:"Modern Culinary Digital Experience & Table Reservation Platform",category:"web",categoryLabel:"Web Development",status:"Completed",year:"2024",client:"TBC Restaurant",role:"Frontend Web Developer",timeline:"3 Weeks",image:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=85",secondaryImage:"https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1200&q=85",accentColor:"#E7AD23",s
